# /etc/nginx/sites-available/glint-api.strophic.in
# Glint API: REST, Server-Sent Events (answers) and WebSockets (live captions).
# Buffering must stay off or answers arrive in one lump instead of streaming.

upstream glint_api {
    server 127.0.0.1:18400;
    keepalive 16;
}

# WebSocket upgrade only when the client asks for it; plain keepalive otherwise.
map $http_upgrade $glint_connection {
    default upgrade;
    ''      '';
}

# Real client IP behind Cloudflare (falls back to the direct peer).
map $http_cf_connecting_ip $glint_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name glint-api.strophic.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name glint-api.strophic.in;

    ssl_certificate     /etc/letsencrypt/live/glint-api.strophic.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glint-api.strophic.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m; # answers can carry a screenshot
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Windows installer (the GitHub repo is private, so it's served from here) and latest.json,
    # which installed apps poll for updates.
    location /downloads/ {
        alias /opt/glint/downloads/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        types { application/octet-stream exe; application/json json; }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://glint_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $glint_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $glint_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;

        # Live sessions can run for an hour; the server pings every 25 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
